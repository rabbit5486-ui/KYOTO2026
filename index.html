<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026 京阪巡禮</title>

<style>
:root{
  --bg:#f8f5ef;
  --paper:#fffdf9;
  --paper-soft:#f4ede2;
  --wood:#b89367;
  --wood-dark:#7e6242;
  --matcha:#7f9573;
  --matcha-dark:#627355;
  --sakura:#d8aea7;
  --line:#e7dccd;
  --ink:#38332d;
  --muted:#72685e;
  --shadow:0 10px 30px rgba(80,60,35,.08);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top left, rgba(216,174,167,.16), transparent 28%),
    radial-gradient(circle at top right, rgba(127,149,115,.13), transparent 28%),
    var(--bg);

  color:var(--ink);

  font-family:
  "Helvetica Neue",
  "Hiragino Sans",
  "Yu Gothic",
  "Noto Sans JP",
  "Noto Sans TC",
  sans-serif;
}

.hero{
  min-height:460px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.05),
      rgba(44,34,24,.55)
    ),
    url("IMG_0426.png") center/cover fixed;

  display:flex;
  align-items:flex-end;

  padding:34px 18px;

  color:white;
  position:relative;
}

.hero::after{
  content:"";
  position:absolute;
  inset:auto 0 0 0;
  height:120px;

  background:linear-gradient(
    transparent,
    var(--bg)
  );
}

.hero-inner{
  position:relative;
  z-index:2;
  max-width:1100px;
  width:100%;
  margin:auto;
}

.kicker{
  display:inline-block;
  padding:8px 14px;
  border-radius:999px;

  background:rgba(255,255,255,.75);

  color:var(--wood-dark);

  font-size:13px;
  font-weight:700;
  letter-spacing:1px;

  margin-bottom:14px;

  backdrop-filter:blur(10px);
}

.hero h1{
  margin:0 0 10px;

  font-size:42px;
  font-weight:600;
  letter-spacing:2px;
  line-height:1.2;

  text-shadow:0 3px 18px rgba(0,0,0,.22);
}

.hero p{
  margin:0;

  line-height:1.8;
  font-size:15px;
  font-weight:400;

  opacity:.96;

  letter-spacing:.5px;

  text-shadow:0 2px 10px rgba(0,0,0,.18);
}

nav{
  position:sticky;
  top:0;
  z-index:99;

  background:rgba(248,245,239,.88);

  backdrop-filter:blur(16px);

  border-bottom:1px solid var(--line);

  overflow-x:auto;
  white-space:nowrap;

  padding:10px 8px;
}

nav button{
  border:1px solid var(--line);

  background:rgba(255,255,255,.85);

  color:var(--ink);

  padding:10px 14px;

  border-radius:999px;

  margin:3px;

  font-size:14px;
  font-weight:700;

  cursor:pointer;

  transition:.2s ease;
}

nav button:hover{
  transform:translateY(-1px);
}

nav button.active{
  background:var(--matcha);
  color:white;
  border-color:var(--matcha);
}

main{
  max-width:1100px;
  margin:auto;
  padding:20px 14px 80px;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

h2{
  font-size:28px;
  margin:10px 0 16px;
}

h3{
  margin:0 0 8px;
  font-size:20px;
}

p{
  line-height:1.8;
}

.card{
  background:rgba(255,255,255,.78);

  border:1px solid var(--line);

  border-radius:24px;

  padding:18px;

  margin-bottom:16px;

  box-shadow:var(--shadow);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:16px;
}

.cover-wrap{
  overflow:hidden;
  border-radius:18px;
  margin:12px 0;
}

.cover{
  width:100%;
  height:220px;
  object-fit:cover;

  display:block;

  transition:
  transform .6s ease,
  filter .6s ease;
}

.place-card:hover .cover{
  transform:scale(1.06);
  filter:saturate(1.04);
}

.hotel-img{
  height:240px;
}

.small{
  color:var(--muted);
  font-size:14px;
}

.badge{
  display:inline-block;

  background:#f0e3cf;

  color:var(--wood-dark);

  padding:6px 11px;

  border-radius:999px;

  margin:4px 4px 4px 0;

  font-size:13px;
  font-weight:700;
}

.transport-flow{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin:18px 0;
}

.transport-item{
  display:flex;
  gap:14px;
  align-items:flex-start;

  padding:14px 16px;

  background:rgba(255,255,255,.72);

  border:1px solid var(--line);

  border-radius:18px;
}

.transport-icon{
  width:42px;
  height:42px;
  min-width:42px;

  border-radius:50%;

  background:linear-gradient(
    135deg,
    #e8dcc8,
    #f7f2e9
  );

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:18px;
}

.transport-content b{
  display:block;
  margin-bottom:4px;
  color:var(--wood-dark);
}

.transport-content{
  line-height:1.8;
  font-size:15px;
}

.timeline{
  position:relative;
  margin-left:8px;
  padding-left:22px;
}

.timeline::before{
  content:"";

  position:absolute;

  left:0;
  top:8px;
  bottom:8px;

  width:2px;

  background:linear-gradient(
    var(--wood),
    var(--matcha),
    var(--sakura)
  );
}

.stop{
  position:relative;
  margin-bottom:18px;
}

.stop::before{
  content:"";

  position:absolute;

  left:-29px;
  top:24px;

  width:14px;
  height:14px;

  border-radius:50%;

  background:white;

  border:4px solid var(--matcha);
}

.place-card{
  transition:
  transform .25s ease,
  box-shadow .25s ease;
}

.place-card:hover{
  transform:translateY(-2px);
}

.map-btn{
  display:inline-flex;
  align-items:center;
  gap:6px;

  padding:10px 14px;

  border-radius:999px;

  background:#efe2cf;

  color:var(--wood-dark);

  text-decoration:none;

  font-weight:700;

  margin-top:6px;
}

input{
  width:100%;

  padding:14px;

  border-radius:16px;

  border:1px solid var(--line);

  font-size:16px;

  margin:6px 0 12px;
}

.result{
  font-size:30px;
  font-weight:800;
  color:var(--wood-dark);
}

.phrase{
  font-size:22px;
  font-weight:700;
  margin-top:8px;
}

.cn{
  color:var(--muted);
}

@media(max-width:700px){

.hero{
  min-height:320px;
  background-attachment:scroll;
}

.hero h1{
  font-size:34px;
}

.cover{
  height:190px;
}

.hotel-img{
  height:200px;
}

main{
  padding:16px 12px 70px;
}

}
</style>
</head>

<body>

const sections = [
  {
id:"home",
title:"首頁",
html:`

<h2>旅行總覽</h2>

<div class="grid">

    target="_blank"

    📍 Google Map
    </a>
  </div>

  <div class="card">
    <h3>🏠 5/27 - 5/30</h3>

    <div class="cover-wrap">
      <img class="cover hotel-img" src="${IMG.androoms}">
    </div>

    <p>
    <b>京都七條安住睦世酒店</b><br>
    ホテル・アンドルームス京都七条
    </p>

    <a class="map-btn"
    target="_blank"
    href="https://maps.app.goo.gl/rWsgZ8T94aN2nRBi7?g_st=ic">

    </a>
  </div>

</div>

<div class="card">
<h3>🗓️ 行程總覽</h3>

<p>
<span class="badge">5/23 入境・錦市場</span>
<span class="badge">5/24 伏見稻荷・清水寺</span>
<span class="badge">5/25 二条城・南禪寺</span>
<span class="badge">5/26 奈良・宇治</span>
<span class="badge">5/27 保津峽・嵐山</span>

</p>

</div>

`
},

{
id:"d523",
title:"5/23",
date:"5/23（六）入境日本｜抵達京都｜錦市場",

weather:"抵達日，以移動與適應天氣為主。晚上可能微涼。",

routes:[

[

],

"搭京都市營烏丸線・國際會館行，搭 2 站到四条站。4 號出口步行約 2 分鐘到飯店。"
],

[

],

places:[

IMG.fresa,

[

],

[

],

],

[

],

[

IMG.kiyomizu,
"世界文化遺產，清水舞台非常經典。",
"https://maps.app.goo.gl/gA4ikYNsTQvPRWie8"
]

]

},

{
id:"currency",
title:"匯率",

html:`

<h2>💱 匯率換算</h2>

<div class="card">

<label>1 JPY = 多少 TWD</label>

<input id="rate" type="number" value="0.22" step="0.001">

<label>輸入日幣</label>

<input id="jpy" type="number" placeholder="例如 5000">

<div class="result" id="twdResult">
約 NT$ 0
</div>

</div>

`

},

{
id:"phrases",
title:"日文字卡",

html:`

<h2>🗾 旅遊日文字卡</h2>

<div class="grid">

${[
["我要這個","これをください"],
["這個多少錢？","これはいくらですか？"],
["可以刷卡嗎？","カードは使えますか？"],
["請問廁所在哪裡？","トイレはどこですか？"],
["我有預約","予約しています"],
["請幫我叫計程車","タクシーを呼んでもらえますか？"]
].map(p=>`

<div class="card">

<div class="cn">${p[0]}</div>

<div class="phrase">${p[1]}</div>

</div>

`).join("")}

</div>

`
}

];

function buildNav(){

const nav=document.getElementById("nav");

sections.forEach((s,i)=>{

const b=document.createElement("button");

b.textContent=s.title;

b.onclick=()=>show(s.id);

if(i===0){
b.classList.add("active");
}

nav.appendChild(b);

});

}

function buildSections(){

const app=document.getElementById("app");

sections.forEach((s,i)=>{

const sec=document.createElement("section");

sec.className="section"+(i===0?" active":"");

sec.id=s.id;

if(s.html){

sec.innerHTML=s.html;

}else{

sec.innerHTML=`

<div class="card">

<h2>${s.date}</h2>

<p class="small">
${s.weather}
</p>

</div>

<div class="card">

<h3>🚃 今日交通動線</h3>

<div class="transport-flow">

${s.routes.map(r=>`

<div class="transport-item">

<div class="transport-icon">
🚃
</div>

<div class="transport-content">

<b>${r[0]}</b>

${r[1]}

</div>

</div>

`).join("")}

</div>

</div>

<div class="timeline">

${s.places.map(p=>`

<div class="stop">

<div class="card place-card">

<h3>${p[0]}</h3>

<div class="cover-wrap">

<img class="cover"
src="${p[1]}"
loading="lazy">

</div>

<p>${p[2]}</p>

<a class="map-btn"
href="${p[3]}"
target="_blank">

📍 Google Map

</a>

</div>

</div>

`).join("")}

</div>

`;

}

app.appendChild(sec);

});

}

function show(id){

document.querySelectorAll(".section")
.forEach(s=>s.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

document.querySelectorAll("nav button")
.forEach(b=>b.classList.remove("active"));

const title=sections.find(s=>s.id===id).title;

[...document.querySelectorAll("nav button")]
.find(b=>b.textContent===title)
.classList.add("active");

window.scrollTo({
top:0,
behavior:"smooth"
});

updateCurrency();

}

function updateCurrency(){

const rate=document.getElementById("rate");

const jpy=document.getElementById("jpy");

const result=document.getElementById("twdResult");

if(rate && jpy && result){

const twd=(
Number(jpy.value||0)
*
Number(rate.value||0)
).toFixed(0);

result.textContent="約 NT$ "+twd;

}

}

document.addEventListener("input",e=>{

if(
e.target.id==="rate"
||
e.target.id==="jpy"
){
updateCurrency();
}

});

buildNav();

buildSections();

updateCurrency();

</script>

</body>
</html>
