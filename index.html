<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>2026 京阪巡禮</title>
<style>
:root{
  --bg:#f7f3ea;
  --paper:#fffdf8;
  --paper2:#f1eadf;
  --line:#d8cbbb;
  --ink:#2f2b26;
  --muted:#6f665d;
  --brown:#8a6f50;
  --brown2:#b79a72;
  --shadow:0 8px 24px rgba(70,55,35,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Helvetica Neue","Hiragino Sans","Yu Gothic","Noto Sans TC","Noto Sans JP",Arial,sans-serif;
  letter-spacing:.2px;
}
.hero{
  min-height:420px;
  background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(42,32,24,.52)),url("IMG_0426.png") center/cover;
  display:flex;
  align-items:flex-end;
  padding:36px 20px;
  color:#fff;
}
.hero-inner{max-width:1100px;margin:auto;width:100%}
.kicker{
  display:inline-block;
  background:rgba(255,253,248,.82);
  color:var(--brown);
  padding:8px 14px;
  font-size:13px;
  font-weight:600;
  letter-spacing:1.5px;
  margin-bottom:14px;
}
.hero h1{
  margin:0 0 10px;
  font-size:42px;
  font-weight:500;
  letter-spacing:3px;
}
.hero p{
  margin:0;
  font-size:15px;
  line-height:1.8;
  font-weight:400;
}
nav{
  position:sticky;
  top:0;
  z-index:99;
  background:rgba(247,243,234,.94);
  border-bottom:1px solid var(--line);
  overflow-x:auto;
  white-space:nowrap;
  padding:10px;
}
nav button{
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  padding:10px 16px;
  margin:0 4px 4px 0;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
}
nav button.active{
  background:var(--brown);
  color:#fff;
  border-color:var(--brown);
}
main{
  max-width:1100px;
  margin:auto;
  padding:24px 14px 80px;
}
.section{display:none}
.section.active{display:block}
h2{
  font-size:28px;
  font-weight:500;
  margin:0 0 18px;
  letter-spacing:1px;
}
h3{
  margin:0 0 10px;
  font-size:20px;
  font-weight:500;
}
p{line-height:1.8}
.card{
  background:rgba(255,253,248,.86);
  border:1px solid var(--line);
  padding:20px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:18px;
}
.imgbox{
  overflow:hidden;
  margin:12px 0;
  background:#e7ded2;
}
.imgbox img{
  display:block;
  width:100%;
  height:220px;
  object-fit:cover;
  transition:transform .65s ease,filter .65s ease;
}
.card:hover .imgbox img{transform:scale(1.04);filter:saturate(1.02)}
.hotel-img{height:240px!important}
.small{font-size:14px;color:var(--muted)}
.badge{
  display:inline-block;
  border:1px solid var(--line);
  background:var(--paper2);
  color:var(--brown);
  padding:6px 10px;
  margin:4px 4px 4px 0;
  font-size:13px;
}
.weather-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:10px;
}
.weather-day{
  border:1px solid var(--line);
  background:#faf6ee;
  padding:12px;
  font-size:14px;
  line-height:1.7;
}
.weather-day b{display:block;color:var(--brown);margin-bottom:4px}
.timeline{
  border-left:1px solid var(--line);
  padding-left:18px;
  margin-left:8px;
}
.step{position:relative;margin-bottom:18px}
.step:before{
  content:"";
  position:absolute;
  left:-23px;
  top:22px;
  width:9px;
  height:9px;
  background:var(--brown2);
}
.transport{
  display:flex;
  gap:14px;
  align-items:flex-start;
  background:#f3ede4;
  border:1px solid var(--line);
  padding:15px 16px;
  box-shadow:none;
}
.transport-icon{
  width:34px;
  min-width:34px;
  font-size:18px;
  text-align:center;
}
.transport b{
  display:block;
  color:var(--brown);
  margin-bottom:5px;
  font-weight:600;
}
.map{
  display:inline-block;
  border:1px solid var(--line);
  background:#f3ede4;
  color:var(--brown);
  padding:9px 13px;
  text-decoration:none;
  font-size:14px;
  font-weight:600;
}
input{
  width:100%;
  padding:13px;
  border:1px solid var(--line);
  background:#fff;
  font-size:16px;
  margin:6px 0 14px;
}
.result{font-size:28px;font-weight:600;color:var(--brown)}
.phrase{font-size:21px;font-weight:500;margin-top:8px}
.cn{color:var(--muted)}
@media(max-width:700px){
  .hero{min-height:320px;padding:28px 16px}
  .hero h1{font-size:34px}
  .hero p{font-size:14px}
  main{padding:18px 12px 70px}
  h2{font-size:24px}
  .card{padding:16px}
  .imgbox img{height:190px}
  .hotel-img{height:200px!important}
  nav button{font-size:13px;padding:9px 12px}
}
</style>
</head>

function buildNav(){
  const nav=document.getElementById("nav");
  sections.forEach((s,i)=>{
    const b=document.createElement("button");
    b.textContent=s.title;
    b.onclick=()=>show(s.id);
    if(i===0)b.classList.add("active");
    nav.appendChild(b);
  });
}

function buildSections(){
  const app=document.getElementById("app");
  sections.forEach((s,i)=>{
    const sec=document.createElement("section");
    sec.className="section"+(i===0?" active":"");
    sec.id=s.id;
    if(s.html){
      sec.innerHTML=s.html;
    }else{
      sec.innerHTML=`
      <div class="card">
        <h2>${s.date}</h2>
        <p class="small">${s.weather}</p>
      </div>
      <div class="timeline">
      ${s.items.map(x=>x.type==="move"
        ? `<div class="step"><div class="transport"><div class="transport-icon">${x.icon}</div><div><b>${x.title}</b>${x.text}</div></div></div>`
        : `<div class="step"><div class="card place-card"><h3>${x.name}</h3><div class="imgbox"><img src="${x.img}" loading="lazy"></div><p>${x.desc}</p><a class="map" href="${x.map}" target="_blank">Google Map</a></div></div>`
      ).join("")}
      </div>`;
    }
    app.appendChild(sec);
  });
}

function show(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  const title=sections.find(s=>s.id===id).title;
  [...document.querySelectorAll("nav button")].find(b=>b.textContent===title).classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
  updateCurrency();
}

function updateCurrency(){
  const rate=document.getElementById("rate");
  const jpy=document.getElementById("jpy");
  const result=document.getElementById("twdResult");
  if(rate&&jpy&&result){
    const r=Number(rate.value||0);
    result.textContent="約 NT$ "+(Number(jpy.value||0)*r).toFixed(0);
    document.querySelectorAll(".quick").forEach(el=>el.textContent=(Number(el.dataset.jpy)*r).toFixed(0));
  }
}

document.addEventListener("input",e=>{
  if(e.target.id==="rate"||e.target.id==="jpy") updateCurrency();
});

buildNav();
buildSections();
updateCurrency();
</script>
