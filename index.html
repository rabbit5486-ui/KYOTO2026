<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026 京阪巡禮</title>

<style>
:root{
  --bg:#f4f1ea;
  --card:#fffaf1;
  --ink:#3f3a33;
  --muted:#7b7165;
  --line:#ded5c7;
  --accent:#9b7b55;
  --accent2:#6f5c45;
  --soft:#e8dfd1;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Serif TC","Noto Sans TC",serif;
  background:var(--bg);
  color:var(--ink);
}
.hero{
  min-height:340px;
  background:
    linear-gradient(rgba(45,38,30,.35),rgba(45,38,30,.55)),
    url("https://source.unsplash.com/1600x900/?kyoto,japan,temple") center/cover;
  color:white;
  display:flex;
  align-items:end;
  padding:32px 20px;
}
.hero-inner{max-width:1050px;margin:auto;width:100%}
.hero h1{font-size:42px;margin:0 0 8px;letter-spacing:4px}
.hero p{margin:0;font-size:17px;opacity:.95}
nav{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(244,241,234,.95);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  overflow-x:auto;
  white-space:nowrap;
  padding:10px;
}
nav button{
  border:1px solid var(--line);
  background:var(--soft);
  color:var(--ink);
  padding:9px 14px;
  border-radius:999px;
  margin:3px;
  cursor:pointer;
}
nav button.active{
  background:var(--accent);
  color:white;
}
main{
  max-width:1050px;
  margin:0 auto;
  padding:22px 16px 60px;
}
.section{display:none}
.section.active{display:block}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 8px 22px rgba(71,61,48,.07);
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
}
h2{font-size:28px;margin:8px 0 16px}
h3{margin:0 0 8px;font-size:20px}
p{line-height:1.75}
.small{color:var(--muted);font-size:14px}
.place-img{
  width:100%;
  height:210px;
  object-fit:cover;
  border-radius:14px;
  margin:10px 0;
  background:#ddd;
}
.timeline{
  border-left:2px solid var(--accent);
  padding-left:16px;
}
.stop{
  margin:0 0 18px;
  position:relative;
}
.stop:before{
  content:"";
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--accent);
  position:absolute;
  left:-23px;
  top:7px;
}
a{
  color:var(--accent2);
  font-weight:700;
  text-decoration:none;
}
.badge{
  display:inline-block;
  background:var(--soft);
  color:var(--accent2);
  padding:4px 9px;
  border-radius:999px;
  font-size:13px;
  margin:3px 3px 3px 0;
}
input,select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:white;
  margin:6px 0 12px;
  font-size:16px;
}
.result{
  font-size:26px;
  font-weight:800;
  color:var(--accent2);
}
.phrase{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}
.cn{
  color:var(--muted);
  margin-bottom:4px;
}
footer{
  text-align:center;
  color:var(--muted);
  padding:30px 12px;
}
</style>
</head>

  sections.forEach((s,i)=>{
    const b=document.createElement("button");
    b.textContent=s.title;
    b.onclick=()=>show(s.id);
    if(i===0)b.classList.add("active");
    nav.appendChild(b);
  });
}

function buildSections(){
  const app=document.getElementById("app");
  sections.forEach((s,i)=>{
    const sec=document.createElement("section");
    sec.className="section"+(i===0?" active":"");
    sec.id=s.id;

    if(s.html){
      sec.innerHTML=s.html;
    }else{
      sec.innerHTML=`
        <h2>${s.date}</h2>
        <div class="card">
          <h3>🌦️ 今日天氣備忘</h3>
          <p>${weatherNote[s.title]}</p>
          <p class="small">實際天氣請出發前更新：最高/最低溫、降雨機率、是否需要雨具。</p>
        </div>
        <div class="timeline">
          ${s.places.map(p=>`
            <div class="stop">
              <div class="card">
                <h3>${p[0]}</h3>
                <img class="place-img" src="${p[2]}" alt="${p[0]}">
                <p>${p[1]}</p>
                <a href="${p[3]}" target="_blank">📍 開啟 Google Map</a>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }
    app.appendChild(sec);
  });
}

function show(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  [...document.querySelectorAll("nav button")].find(b=>b.textContent===sections.find(s=>s.id===id).title).classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
  updateCurrency();
}

function updateCurrency(){
  const rate=document.getElementById("rate");
  const jpy=document.getElementById("jpy");
  const result=document.getElementById("twdResult");
  if(rate && jpy && result){
    const twd=(Number(jpy.value||0)*Number(rate.value||0)).toFixed(0);
    result.textContent="約 NT$ "+twd;
    document.querySelectorAll(".quick").forEach(el=>{
      el.textContent=(Number(el.dataset.jpy)*Number(rate.value||0)).toFixed(0);
    });
  }
}

document.addEventListener("input",e=>{
  if(e.target.id==="rate" || e.target.id==="jpy") updateCurrency();
});

buildNav();
buildSections();
updateCurrency();
</script>

</body>
</html>
