<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026 京阪巡禮</title>

<style>
:root{
  --bg:#faf7ef;
  --paper:#fffdf8;
  --paper-soft:#f6efe3;
  --wood:#c9a36f;
  --wood-dark:#8c6a43;
  --matcha:#8da37f;
  --matcha-dark:#667a58;
  --sakura:#e9b7ad;
  --sakura-soft:#fae8e3;
  --ink:#3e3830;
  --muted:#7c7064;
  --line:#e6dac9;
  --shadow:0 12px 32px rgba(91,70,42,.10);
  --radius:22px;
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top left, rgba(233,183,173,.22), transparent 30%),
    radial-gradient(circle at top right, rgba(141,163,127,.18), transparent 28%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Noto Serif TC","Helvetica Neue",Arial,sans-serif;
}

.hero{
  min-height:390px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.12), rgba(64,48,32,.48)),
    url("IMG_0426.png") center/cover fixed;
  display:flex;
  align-items:flex-end;
  padding:34px 18px;
  color:white;
  position:relative;
  overflow:hidden;
}

.hero::after{
  content:"";
  position:absolute;
  inset:auto 0 0 0;
  height:110px;
  background:linear-gradient(transparent, var(--bg));
}

.hero-inner{
  position:relative;
  z-index:2;
  width:100%;
  max-width:1120px;
  margin:0 auto;
}

.kicker{
  display:inline-block;
  padding:7px 12px;
  background:rgba(255,253,248,.78);
  color:var(--wood-dark);
  border-radius:999px;
  font-weight:800;
  letter-spacing:1px;
  margin-bottom:12px;
  backdrop-filter:blur(10px);
}

.hero h1{
  margin:0 0 8px;
  font-size:44px;
  letter-spacing:4px;
  text-shadow:0 3px 18px rgba(0,0,0,.28);
}

.hero p{
  margin:0;
  line-height:1.7;
  font-size:16px;
  text-shadow:0 2px 12px rgba(0,0,0,.25);
}

nav{
  position:sticky;
  top:0;
  z-index:99;
  background:rgba(250,247,239,.88);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  overflow-x:auto;
  white-space:nowrap;
  padding:10px 9px;
}

nav button{
  border:1px solid var(--line);
  background:rgba(255,253,248,.92);
  color:var(--ink);
  padding:10px 14px;
  border-radius:999px;
  margin:3px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:.22s ease;
}

nav button:hover{
  transform:translateY(-1px);
  background:var(--paper-soft);
}

nav button.active{
  background:var(--matcha);
  color:white;
  border-color:var(--matcha);
  box-shadow:0 6px 16px rgba(102,122,88,.22);
}

main{
  width:100%;
  max-width:1120px;
  margin:0 auto;
  padding:22px 14px 76px;
}

.section{display:none}
.section.active{display:block}

h2{
  font-size:28px;
  margin:10px 0 16px;
  letter-spacing:.5px;
}

h3{
  margin:0 0 8px;
  font-size:20px;
}

p{
  line-height:1.78;
}

a{
  color:var(--wood-dark);
  font-weight:800;
  text-decoration:none;
}

.card{
  background:rgba(255,253,248,.92);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:16px;
}

.cover-wrap{
  border-radius:18px;
  overflow:hidden;
  margin:11px 0;
  background:#eadfce;
}

.cover{
  width:100%;
  height:220px;
  object-fit:cover;
  display:block;
  transform:scale(1.02);
  transition:transform .55s ease, filter .55s ease;
}

.card:hover .cover{
  transform:scale(1.075);
  filter:saturate(1.05) brightness(1.03);
}

.hotel-img{
  height:235px;
}

.small{
  color:var(--muted);
  font-size:14px;
}

.badge{
  display:inline-block;
  background:#f1e5d4;
  color:var(--wood-dark);
  padding:6px 11px;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
  margin:4px 4px 4px 0;
}

.day-head{
  background:linear-gradient(135deg, #fffdf8, #f6efe3);
  border:1px solid var(--line);
  border-radius:26px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}

.weather-card{
  background:linear-gradient(135deg, #f7efe4, #fae8e3);
  border-left:6px solid var(--sakura);
}

.route-card{
  background:linear-gradient(135deg, #fffdf8, #f2eadc);
}

.route{
  background:rgba(255,255,255,.58);
  border:1px solid var(--line);
  border-left:5px solid var(--wood);
  padding:14px 15px;
  border-radius:17px;
  margin:12px 0;
}

.route-title{
  font-weight:900;
  color:var(--wood-dark);
  margin-bottom:6px;
}

.timeline{
  position:relative;
  margin-left:9px;
  padding-left:22px;
}

.timeline::before{
  content:"";
  position:absolute;
  left:0;
  top:8px;
  bottom:8px;
  width:2px;
  background:linear-gradient(var(--wood), var(--matcha), var(--sakura));
  border-radius:999px;
}

.stop{
  position:relative;
  margin-bottom:18px;
}

.stop::before{
  content:"";
  position:absolute;
  left:-28px;
  top:24px;
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--paper);
  border:4px solid var(--matcha);
  box-shadow:0 0 0 4px var(--bg);
}

.place-card{
  transition:transform .28s ease, box-shadow .28s ease;
}

.place-card:hover{
  transform:translateY(-3px);
  box-shadow:0 16px 38px rgba(91,70,42,.14);
}

.map-btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:9px 13px;
  border-radius:999px;
  background:#f0e3cf;
  color:var(--wood-dark);
  margin-top:4px;
}

input{
  width:100%;
  padding:14px;
  border-radius:16px;
  border:1px solid var(--line);
  font-size:16px;
  margin:6px 0 13px;
  background:white;
}

.result{
  font-size:30px;
  font-weight:900;
  color:var(--wood-dark);
}

.phrase{
  font-size:22px;
  font-weight:900;
  margin-top:8px;
}

.cn{
  color:var(--muted);
}

footer{
  text-align:center;
  color:var(--muted);
  padding:28px 12px;
}

@media(max-width:700px){
  .hero{
    min-height:310px;
    background-attachment:scroll;
    padding:26px 16px;
  }

  .hero h1{
    font-size:34px;
  }

  .hero p{
    font-size:14px;
  }

  main{
    padding:16px 12px 70px;
  }

  h2{
    font-size:23px;
  }

  .card{
    padding:15px;
    border-radius:20px;
  }

  .cover{
    height:190px;
  }

  .hotel-img{
    height:200px;
  }

  nav button{
    font-size:13px;
    padding:9px 12px;
  }
}
</style>
</head>

function buildNav(){
  const nav=document.getElementById("nav");
  sections.forEach((s,i)=>{
    const b=document.createElement("button");
    b.textContent=s.title;
    b.onclick=()=>show(s.id);
    if(i===0)b.classList.add("active");
    nav.appendChild(b);
  });
}

function buildSections(){
  const app=document.getElementById("app");

  sections.forEach((s,i)=>{
    const sec=document.createElement("section");
    sec.className="section"+(i===0?" active":"");
    sec.id=s.id;

    if(s.html){
      sec.innerHTML=s.html;
    }else{
      sec.innerHTML=`
        <div class="day-head">
          <h2>${s.date}</h2>
          <p class="small">點選上方日期分頁可切換每日行程。</p>
        </div>

        <div class="card weather-card">
          <h3>🌦️ 今日天氣備忘</h3>
          <p>${s.weather}</p>
          <p class="small">實際天氣請出發前 7–10 天更新。</p>
        </div>

        <div class="card route-card">
          <h3>🚃 今日交通動線</h3>
          ${s.routes.map(r=>`
            <div class="route">
              <div class="route-title">${r[0]}</div>
              <p>${r[1]}</p>
            </div>
          `).join("")}
        </div>

        <div class="timeline">
          ${s.places.map(p=>`
            <div class="stop">
              <div class="card place-card">
                <h3>${p[0]}</h3>
                <div class="cover-wrap"><img class="cover" src="${p[1]}" alt="${p[0]}" loading="lazy"></div>
                <p>${p[2]}</p>
                <a class="map-btn" href="${p[3]}" target="_blank">📍 開啟 Google Map</a>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    app.appendChild(sec);
  });
}

function show(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  const title=sections.find(s=>s.id===id).title;
  [...document.querySelectorAll("nav button")].find(b=>b.textContent===title).classList.add("active");

  window.scrollTo({top:0,behavior:"smooth"});
  updateCurrency();
}

function updateCurrency(){
  const rate=document.getElementById("rate");
  const jpy=document.getElementById("jpy");
  const result=document.getElementById("twdResult");

  if(rate && jpy && result){
    const twd=(Number(jpy.value||0)*Number(rate.value||0)).toFixed(0);
    result.textContent="約 NT$ "+twd;

    document.querySelectorAll(".quick").forEach(el=>{
      el.textContent=(Number(el.dataset.jpy)*Number(rate.value||0)).toFixed(0);
    });
  }
}

document.addEventListener("input",e=>{
  if(e.target.id==="rate" || e.target.id==="jpy") updateCurrency();
});

buildNav();
buildSections();
updateCurrency();
</script>
